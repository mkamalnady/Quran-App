services:
  - type: web
    name: quran-app-backend
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r QuranMemoryApp2/requirements.txt
      cd QuranMemoryApp2
      # تأكد من تشغيل المايجريشن قبل تجميع الستاتيك
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
      # أنشئ/حدّث صف django_site تلقائياً (غير domain لو لازم)
      python - <<'PY'
import os
os.environ.setdefault('DJANGO_SETTINGS_MODULE','quran_backend.settings')
import django
django.setup()
from django.contrib.sites.models import Site
Site.objects.update_or_create(
    id=1,
    defaults={'domain':'quran-app-8ay9.onrender.com','name':'Quran App'}
)
PY
    startCommand: |
      bash -lc "cd QuranMemoryApp2 && gunicorn quran_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: quran_backend.settings
      - key: SECRET_KEY
        value: django-insecure-quran-app-secret-key-2024-render-production-v2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "quran-app-8ay9.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: quran-app-db
          property: connectionString

databases:
  - name: quran-app-db
    databaseName: quran_app
    user: quran_user
    plan: free
