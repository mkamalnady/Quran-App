services:
  - type: web
    name: quran-app-backend
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r QuranMemoryApp2/requirements.txt
      cd QuranMemoryApp2 && python manage.py collectstatic --noinput
    startCommand: |
      bash -lc "cd QuranMemoryApp2 && python manage.py migrate && gunicorn quran_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: quran_backend.settings
      - key: SECRET_KEY
        value: django-insecure-quran-app-secret-key-2024-render-production-v2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "quran-app-8ay9.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: quran-app-db
          property: connectionString

databases:
  - name: quran-app-db
    databaseName: quran_app
    user: quran_user
    plan: free